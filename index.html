<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --ink: #17202e;
    --muted: #5d6b7f;
    --line: #d5dce6;
    --accent: #2f5bea;
    --hover: #e4e9f2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161f;
      --surface: #1a212d;
      --ink: #e7ecf4;
      --muted: #8d9bb0;
      --line: #2a3342;
      --accent: #7c9bff;
      --hover: #232c3b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161f;
    --surface: #1a212d;
    --ink: #e7ecf4;
    --muted: #8d9bb0;
    --line: #2a3342;
    --accent: #7c9bff;
    --hover: #232c3b;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

  #banner {
    display: none;
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 32px;
  }
  #banner.on { display: block; }

  header { text-align: center; margin-bottom: 48px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
  #clock { display: block; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; }

  #groups { columns: 3 280px; column-gap: 40px; }
  section { break-inside: avoid; margin-bottom: 36px; }
  h2 {
    margin: 0 0 8px; padding-bottom: 8px;
    font-size: 1rem; font-weight: 650;
    border-bottom: 1px solid var(--line);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  a.link {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; margin: 0 -10px;
    border-radius: 8px;
    color: var(--ink); text-decoration: none;
  }
  a.link:hover, a.link:focus-visible { background: var(--hover); }
  a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  a.link img { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; flex: none; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host { color: var(--muted); font-size: .8rem; white-space: nowrap; }

  footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: .85rem; }
  footer button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline;
  }
  footer button:hover { color: var(--ink); }

  @media (max-width: 520px) {
    .wrap { padding: 20px 16px 56px; }
    #banner { height: 150px; }
    h1 { font-size: 1.6rem; }
    .host { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    a.link { transition: background-color .12s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <img id="banner" alt="">

  <header>
    <h1 id="title">Links</h1>
    <span id="clock"></span>
  </header>

  <main id="groups"></main>

  <footer>
    <button id="theme" type="button">Switch theme</button>
  </footer>
</div>

<script>
/* ============================================================
   EDIT THIS PART
   ============================================================ */

/* Banner image at the top. Upload the image to your repo next to
   index.html with this exact filename (or change the name here).
   If the file doesn't exist, no banner is shown. */
const BANNER_IMAGE = "banner.jpg";

/* Centered page title. */
const TITLE = "Links";

/* Each link is [name, url] or [name, url, iconImage].
   iconImage is optional: a filename in your repo or a full image URL.
   Without it, the site's own icon is used. */
const GROUPS = [
  {
    title: "Planning",
    links: [
      ["Carat Calc/Pull Plan", "https://umacaratcalculator.com/app"],
      ["Support Card Compare", "https://gametora.com/umamusume/compare"],
      ["Support Card Tier List", "https://euophrys.github.io/uma-tiers/#/global"],
      ["Uma Moe Club", "https://uma.moe/circles"],
    ],
  },
  {
    title: "Parent & General Calc",
    links: [
      ["Database", "https://uma.moe/database"],
      ["Affinity Calc", "https://gametora.com/umamusume/compatibility"],
      ["Stamina Calc", "https://federicoheichou.github.io/umamusume-stamina-calculator-global/"],
      ["Race Simulator", "https://alpha123.github.io/uma-tools/umalator-global/compare"],
    ],
  },
  {
    title: "Uma & Skill Lists",
    links: [
      ["Game Tora Skills", "https://gametora.com/umamusume/skills"],
      ["Game Tora Uma", "https://gametora.com/umamusume/characters"],
      ["Game Tora Support Card", "https://gametora.com/umamusume/supports"],
    ],
  },
  {
    title: "Guide & Useful Stuff",
    links: [
      ["Uma Guide", "https://uma.guide/"],
      ["Game Tora", "https://gametora.com/umamusume"],
    ],
  },
];
/* ============================================================ */

const $ = (s) => document.querySelector(s);
const host = (u) => new URL(u).hostname.replace(/^www\./, "");
const autoIcon = (u) => `https://www.google.com/s2/favicons?sz=64&domain=${host(u)}`;

/* Title + page tab name */
$("#title").textContent = TITLE;
document.title = TITLE;

/* Banner */
if (BANNER_IMAGE) {
  const b = $("#banner");
  b.onload = () => b.classList.add("on");
  b.src = BANNER_IMAGE;
}

/* Links */
const root = $("#groups");
for (const g of GROUPS) {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2></h2><ul></ul>`;
  sec.querySelector("h2").textContent = g.title;
  const ul = sec.querySelector("ul");

  for (const [name, url, customIcon] of g.links) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "link";
    a.href = url;
    a.rel = "noopener";
    a.innerHTML = `<img alt="" loading="lazy"><span class="name"></span><span class="host"></span>`;
    const img = a.querySelector("img");
    img.src = customIcon || autoIcon(url);
    if (customIcon) img.onerror = () => { img.onerror = null; img.src = autoIcon(url); };
    a.querySelector(".name").textContent = name;
    a.querySelector(".host").textContent = host(url);
    li.append(a);
    ul.append(li);
  }
  root.append(sec);
}

/* Clock */
function tick() {
  $("#clock").textContent = new Date().toLocaleString([], { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}
tick();
setInterval(tick, 30000);

/* Theme toggle (remembered per browser) */
const docEl = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) docEl.dataset.theme = t; } catch {}
$("#theme").addEventListener("click", () => {
  const dark = docEl.dataset.theme
    ? docEl.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  docEl.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", docEl.dataset.theme); } catch {}
});
</script>
</body>
</html>
